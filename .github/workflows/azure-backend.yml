name: Build backend container

on:
  workflow_dispatch:
  push:
    branches: [main, backend]
    paths:
      - "backend/**"
      - "ml_engine/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/azure-backend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: catstatscr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            catstatscr.azurecr.io/cat-stats-backend:v2
            catstatscr.azurecr.io/cat-stats-backend:${{ github.sha }}
